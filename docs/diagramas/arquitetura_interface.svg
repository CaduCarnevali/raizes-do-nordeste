<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
  <defs><style>.title{font:700 34px Arial;fill:#111}.box{fill:#fff;stroke:#8f2c20;stroke-width:4}.head{font:700 24px Arial;fill:#8f2c20}.body{font:18px Arial;fill:#333}.line{stroke:#8f2c20;stroke-width:4;fill:none}.mock{stroke-dasharray:12 8}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#8f2c20"/></marker></defs>
  <rect width="1500" height="700" fill="#fafafa"/><text x="750" y="58" text-anchor="middle" class="title">Arquitetura da Interface e dos Dados Mockados</text>
  <g transform="translate(60 150)"><rect width="260" height="330" rx="22" class="box"/><text x="130" y="55" text-anchor="middle" class="head">Canais</text><text x="130" y="115" text-anchor="middle" class="body">Web desktop</text><text x="130" y="170" text-anchor="middle" class="body">App mobile</text><text x="130" y="225" text-anchor="middle" class="body">Totem vertical</text><text x="130" y="290" text-anchor="middle" class="body">Layout responsivo</text></g>
  <g transform="translate(440 100)"><rect width="390" height="430" rx="22" class="box"/><text x="195" y="55" text-anchor="middle" class="head">SPA Vue 3</text><text x="195" y="115" text-anchor="middle" class="body">Componentes e estado reativo</text><text x="195" y="165" text-anchor="middle" class="body">Bootstrap 5 e CSS responsivo</text><text x="195" y="215" text-anchor="middle" class="body">Carrinho e checkout</text><text x="195" y="265" text-anchor="middle" class="body">LGPD e consentimento</text><text x="195" y="315" text-anchor="middle" class="body">Pontos e histórico</text><text x="195" y="365" text-anchor="middle" class="body">Dados somente na sessão</text></g>
  <g transform="translate(950 100)"><rect width="390" height="250" rx="22" class="box"/><text x="195" y="55" text-anchor="middle" class="head">Arquivos JSON</text><text x="195" y="112" text-anchor="middle" class="body">units.json</text><text x="195" y="150" text-anchor="middle" class="body">menu.json e promotions.json</text><text x="195" y="188" text-anchor="middle" class="body">customers.json</text></g>
  <g transform="translate(950 410)"><rect width="390" height="170" rx="22" class="box"/><text x="195" y="55" text-anchor="middle" class="head">Pagamento externo</text><text x="195" y="105" text-anchor="middle" class="body">Envio e retorno simulados</text><text x="195" y="138" text-anchor="middle" class="body">Sem transação real</text></g>
  <path d="M320 315H440" class="line" marker-end="url(#a)"/><path d="M830 220H950" class="line" marker-end="url(#a)"/><path d="M830 430L950 490" class="line mock" marker-end="url(#a)"/><text x="865" y="455" class="body">mock</text>
  <text x="750" y="640" text-anchor="middle" class="body">A separação entre interface e JSON permite substituir os mocks por APIs sem reconstruir o fluxo visual.</text>
</svg>
