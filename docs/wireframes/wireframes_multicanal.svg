<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs><style>.title{font:700 34px Arial;fill:#111}.panel{fill:#f7f7f7;stroke:#222;stroke-width:4}.screen{fill:#fff;stroke:#777;stroke-width:3}.bar{fill:#dedede}.block{fill:#ececec;stroke:#999;stroke-width:2}.button{fill:#bdbdbd;stroke:#555;stroke-width:2}.label{font:700 22px Arial;fill:#222}.small{font:17px Arial;fill:#444}.tiny{font:14px Arial;fill:#555}</style></defs>
  <rect width="1800" height="1100" fill="#fafafa"/><text x="900" y="52" text-anchor="middle" class="title">Wireframes de Baixa Fidelidade para Web Mobile e Totem</text>

  <g transform="translate(60 110)"><text x="300" y="0" text-anchor="middle" class="label">Web desktop</text><rect x="0" y="30" width="600" height="860" rx="14" class="panel"/><rect x="25" y="55" width="550" height="65" class="bar"/><text x="50" y="95" class="small">Marca</text><text x="455" y="95" class="tiny">Conta | Pedido</text><rect x="25" y="145" width="550" height="210" class="block"/><text x="50" y="195" class="label">Mensagem principal</text><rect x="50" y="235" width="165" height="44" rx="8" class="button"/><text x="70" y="263" class="small">Escolher unidade</text><rect x="25" y="380" width="265" height="120" class="block"/><rect x="310" y="380" width="265" height="120" class="block"/><text x="35" y="535" class="label">Cardápio</text><g transform="translate(25 560)"><rect width="170" height="135" class="block"/><rect x="190" width="170" height="135" class="block"/><rect x="380" width="170" height="135" class="block"/><rect y="155" width="170" height="135" class="block"/><rect x="190" y="155" width="170" height="135" class="block"/><rect x="380" y="155" width="170" height="135" class="block"/></g></g>

  <g transform="translate(730 110)"><text x="180" y="0" text-anchor="middle" class="label">App mobile</text><rect x="0" y="30" width="360" height="860" rx="38" class="panel"/><rect x="22" y="62" width="316" height="58" class="bar"/><text x="42" y="98" class="small">Marca</text><rect x="22" y="145" width="316" height="190" class="block"/><text x="42" y="185" class="label">Mensagem</text><rect x="42" y="225" width="160" height="44" rx="8" class="button"/><rect x="22" y="360" width="316" height="105" class="block"/><rect x="22" y="485" width="316" height="105" class="block"/><text x="22" y="630" class="label">Cardápio</text><rect x="22" y="655" width="316" height="135" class="block"/><rect x="22" y="812" width="316" height="55" rx="10" class="button"/><text x="65" y="846" class="small">Ver pedido e total</text></g>

  <g transform="translate(1180 110)"><text x="260" y="0" text-anchor="middle" class="label">Totem vertical</text><rect x="0" y="30" width="520" height="860" rx="20" class="panel"/><rect x="30" y="65" width="460" height="75" class="bar"/><text x="55" y="110" class="small">Marca e identificação</text><rect x="30" y="170" width="460" height="170" class="block"/><text x="60" y="220" class="label">Escolha da unidade</text><rect x="60" y="260" width="180" height="50" rx="8" class="button"/><text x="30" y="390" class="label">Produtos em destaque</text><g transform="translate(30 420)"><rect width="220" height="150" class="block"/><rect x="240" width="220" height="150" class="block"/><rect y="175" width="220" height="150" class="block"/><rect x="240" y="175" width="220" height="150" class="block"/></g><rect x="70" y="785" width="380" height="65" rx="10" class="button"/><text x="170" y="826" class="small">Continuar pedido</text></g>

  <text x="900" y="1040" text-anchor="middle" class="small">A arquitetura mantém o mesmo fluxo e reorganiza conteúdo e áreas de toque conforme o canal.</text>
</svg>
